# Logical gamepad action -> X11 keysym (for xdotool), for driving Xenia's
# keyboard->controller emulation. Format: ACTION=keysym  ('#' comments).
#
# !!! UNVERIFIED SEED VALUES !!!
# These are a plausible starting point ONLY. Xenia's keyboard->pad mapping must
# be confirmed empirically against THIS xenia-edge build via one VNC session
# (see INPUT_MAP.md for the procedure), then corrected here. Until a human/agent
# has driven the CivRev menu over VNC and updated these, do not trust that a
# given ACTION navigates the UI — only that input.sh delivers the keysym.
#
# xdotool keysym reference: letters a-z, Return, Escape, space, Up/Down/Left/Right,
# BackSpace, Tab, etc.

# Face buttons
A=Return
B=Escape
X=q
Y=e

# Menu / system
START=Return
BACK=Escape
GUIDE=Home

# D-pad
DPAD_UP=Up
DPAD_DOWN=Down
DPAD_LEFT=Left
DPAD_RIGHT=Right

# Left stick (digital taps)
LSTICK_UP=w
LSTICK_DOWN=s
LSTICK_LEFT=a
LSTICK_RIGHT=d

# Shoulders / triggers
LB=bracketleft
RB=bracketright
LT=minus
RT=equal
