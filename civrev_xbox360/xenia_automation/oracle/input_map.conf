# Logical action -> virtpad command (see virtpad.py). input.sh writes the RHS to
# the virtual gamepad's FIFO. Xenia hid="sdl" reads this virtual Xbox 360 pad.
# Verified 2026-07-11: these drive CivRev's menus (A=confirm/accept, B=back/cancel,
# START=advance, D-pad=navigate). Presses hold 0.2s — the game polls too slowly to
# catch a shorter tap.

A=press A 0.2
B=press B 0.2
X=press X 0.2
Y=press Y 0.2
START=press START 0.2
BACK=press BACK 0.2
GUIDE=press GUIDE 0.2
LB=press LB 0.2
RB=press RB 0.2
LT=trig l 255
RT=trig r 255
DPAD_UP=dpad up
DPAD_DOWN=dpad down
DPAD_LEFT=dpad left
DPAD_RIGHT=dpad right
