# Logical action -> virtpad command (see virtpad.py). input.sh writes the RHS to
# the virtual gamepad's FIFO. Xenia hid="sdl" reads this virtual Xbox 360 pad.
# Verified 2026-07-11: these drive CivRev's menus (A=confirm/accept, B=back/cancel,
# START=advance, D-pad=navigate). Presses hold 0.4s — a shorter hold drops intermittently on this game (the
# game samples controller input too slowly to catch it).

A=press A 0.4
B=press B 0.4
X=press X 0.4
Y=press Y 0.4
START=press START 0.4
BACK=press BACK 0.4
GUIDE=press GUIDE 0.4
LB=press LB 0.4
RB=press RB 0.4
LT=trig l 255
RT=trig r 255
DPAD_UP=dpad up
DPAD_DOWN=dpad down
DPAD_LEFT=dpad left
DPAD_RIGHT=dpad right
