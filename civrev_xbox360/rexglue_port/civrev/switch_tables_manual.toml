# Hand-verified jump tables for the middleware message-dispatcher family
# (four template copies x three chained dispatchers; guard cmplwi rIDX,220;
# 221-entry table INLINE right after the bctr). ReXGlue's analysis
# under-populates these (knew 1 case of 221) -> unhandled message ids hit
# default:__builtin_trap() = infinite silent ud2 spin; first symptom: the
# CivConsole thread hangs the map load on the Loading screen at
# sub_82DAD720. Labels dumped from live guest memory (tables are static
# rdata; host addr = 0x100000000+guest). bctr = table-4 (inline family
# invariant). Regeneration: tools/dump_switch_tables_live.md.
# DO NOT bulk-add tables decoded from generated-code comments: table data
# misdecoded as functions yields accidental dispatch shapes with WRONG bctr
# addresses, and overriding those corrupts unrelated function partitioning
# (broke boot with 'Jump target 0x8250377C unresolved at bctr 0x825033AC').

